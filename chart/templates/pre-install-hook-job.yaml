# Helm requires that both a pre-install and post-install hook be implemented for
# it to wait until the post-install hook is "Ready" before it exits.
# The post-install hook is supposed to make helm wait until the deployments are
# successfully rolled out, therefore a pre-install hook must also be
# implemented - even if it's a trivial noop.
# See also:
# https://helm.sh/docs/topics/charts_hooks/#hooks-and-the-release-lifecycle

{{- if .Values.postInstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "rancher.fullname" . }}-pre-install
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rancher.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      name: {{ template "rancher.fullname" . }}-pre-install
      labels: {{ include "rancher.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ template "rancher.name" . }}-pre-install
          image: "{{ include "system_default_registry" . }}{{ .Values.postInstall.image.repository }}:{{ .Values.postInstall.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sleep 5
{{- end }}
